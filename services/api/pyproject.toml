[project]
name = "pid-digitizer-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "pillow==11.3.0",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "pypdfium2==4.30.0",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.4.1", "ruff==0.12.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
