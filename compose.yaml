services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pid_digitizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pid_digitizer"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
      args:
        INSTALL_PYDEXPI: ${INSTALL_PYDEXPI:-false}
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pid_digitizer
      STORAGE_DIR: /app/data
      DIGITIZER_PROVIDER: fake
      DEXPI_ENABLED: "false"
      DEMO_MOCK_GRAPH: "true"
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      PYDEXPI_EXPORT_ENABLED: ${PYDEXPI_EXPORT_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/app/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  document_storage:
